<!doctype html>
<html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ankit Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:white;font:16px system-ui;text-align:center}header{padding:12px;display:flex;justify-content:space-between}canvas{display:block;width:min(100vw,520px);height:min(72vh,690px);margin:auto;background:#ca8b70;touch-action:none}button{border:0;border-radius:12px;background:#087eb5;color:white;padding:15px;font-weight:800;margin:5px;min-width:68px}#start{position:fixed;inset:0;background:#07111edb;display:grid;place-content:center}#start button{font-size:18px;padding:18px 28px}.hint{font-size:12px;color:#b8ccdf}
</style><header><b>ANKIT <span style="color:#69e6ff">RACING</span></b><span>SCORE <b id="s">0</b> · <b id="v">0</b> km/h</span></header><canvas id="c"></canvas><div><button id="l">◀</button><button id="b">BRAKE</button><button id="g">ACCELERATE ▲</button><button id="r">▶</button></div><p class="hint">Arrow keys or touch controls • Dodge traffic</p><div id="start"><h1>🏎️ ANKIT RACING</h1><p>Highway challenge</p><button id="play">START RACE</button></div>
<script>
const c=document.querySelector('#c'),q=c.getContext('2d');let W,H,d=1,go=false,x=0,spd=80,score=0,off=0,last=0,dir=0,gas=false,brake=false,traffic=[],spawn=0;
function size(){let r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;q.setTransform(d,0,0,d,0,0)}onresize=size;size();
function road(y){let z=y/H;return {x:W/2+Math.sin(off*.001+z*2)*W*.025*z,w:W*(.18+.69*z)}}
function poly(p,col){q.fillStyle=col;q.beginPath();p.forEach((a,i)=>i?q.lineTo(...a):q.moveTo(...a));q.closePath();q.fill()}
function car(x,y,w,h,col){q.save();q.translate(x,y);q.fillStyle='#0007';q.beginPath();q.ellipse(0,h*.35,w*.6,h*.17,0,0,7);q.fill();poly([[-w*.48,h*.4],[-w*.4,-h*.3],[-w*.2,-h*.48],[w*.2,-h*.48],[w*.4,-h*.3],[w*.48,h*.4]],col);poly([[-w*.28,-h*.18],[-w*.18,-h*.38],[w*.18,-h*.38],[w*.28,-h*.18]],'#172b40');q.fillStyle='#fff3b1';q.fillRect(-w*.36,-h*.2,w*.12,h*.07);q.fillRect(w*.24,-h*.2,w*.12,h*.07);q.fillStyle='#ff4054';q.fillRect(-w*.36,h*.22,w*.12,h*.07);q.fillRect(w*.24,h*.22,w*.12,h*.07);q.restore()}
function draw(){q.clearRect(0,0,W,H);let g=q.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f6b77e');g.addColorStop(.42,'#b96b6d');g.addColorStop(.43,'#344a43');g.addColorStop(1,'#12271f');q.fillStyle=g;q.fillRect(0,0,W,H);poly([[0,H*.43],[W*.2,H*.25],[W*.38,H*.4],[W*.56,H*.24],[W*.76,H*.42],[W,H*.28],[W,H*.6],[0,H*.6]],'#3b435b');let a=road(H*.28),b=road(H);poly([[a.x-a.w/2,H*.28],[a.x+a.w/2,H*.28],[b.x+b.w/2,H],[b.x-b.w/2,H]],'#343b48');for(let i=0;i<13;i++){let z=((i/13+off/2500)%1),y=H*.28+z*z*H*.72,r=road(y);q.fillStyle='#fff';q.fillRect(r.x-r.w/6,y,2+z*3,3+z*14);q.fillRect(r.x+r.w/6,y,2+z*3,3+z*14)}traffic.forEach(o=>{let r=road(o.y);car(r.x+(o.lane-1)*r.w*.29,o.y,Math.max(15,W*.12*o.y/H),Math.max(26,H*.11*o.y/H),o.col)});let r=road(H*.82);car(r.x+x*r.w*.33,H*.82,W*.22,H*.18,'#087dc4')}
function end(){go=false;document.querySelector('#start').style.display='grid';document.querySelector('#start h1').textContent='RACE OVER';document.querySelector('#start p').textContent='Your score: '+score;document.querySelector('#play').textContent='RACE AGAIN'}
function begin(){go=true;x=0;spd=80;score=0;traffic=[];off=0;spawn=0;last=0;document.querySelector('#start').style.display='none'}
document.querySelector('#play').onclick=begin;
function hold(id,on,offfn){let e=document.querySelector('#'+id);e.onpointerdown=a=>{a.preventDefault();on()};['pointerup','pointercancel','pointerleave'].forEach(k=>e.addEventListener(k,offfn))}
hold('l',()=>dir=-1,()=>dir=0);hold('r',()=>dir=1,()=>dir=0);hold('g',()=>gas=true,()=>gas=false);hold('b',()=>brake=true,()=>brake=false);
let tx=null;c.onpointerdown=e=>tx=e.clientX;c.onpointermove=e=>{if(tx!==null&&go){x=Math.max(-1,Math.min(1,x+(e.clientX-tx)/W*2));tx=e.clientX}};c.onpointerup=()=>tx=null;c.onpointercancel=()=>tx=null;
onkeydown=e=>{if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1;if(e.key==='ArrowUp')gas=true;if(e.key==='ArrowDown')brake=true};onkeyup=e=>{dir=0;gas=false;brake=false};
function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(go){spd=Math.min(220,spd+(gas?1.4:.12)*dt);if(brake)spd=Math.max(0,spd-2.4*dt);x=Math.max(-1,Math.min(1,x+dir*.055*dt));off+=spd*dt;score+=Math.floor(spd*dt/100);spawn+=dt*spd/100;if(spawn>22){spawn=0;traffic.push({y:H*.27,lane:Math.floor(Math.random()*3),col:['#e7434f','#e8edf3','#efa12b','#6d62dc'][Math.floor(Math.random()*4)]})}traffic.forEach(o=>o.y+=(2.5+spd/30)*dt);traffic=traffic.filter(o=>o.y<H+50);let pr=road(H*.82),px=pr.x+x*pr.w*.33;for(let o of traffic){let rr=road(o.y),cx=rr.x+(o.lane-1)*rr.w*.29;if(o.y>H*.73&&o.y<H*.91&&Math.abs(cx-px)<W*.105){end();break}}document.querySelector('#s').textContent=score;document.querySelector('#v').textContent=Math.round(spd)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
